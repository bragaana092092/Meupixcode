<style>
*{box-sizing:border-box;font-family:Arial}

/* ===== Responsivo para telas pequenas ===== */

</style>
</head>
<body>
<div class="container">

    <div class="topBar" id="topBar">
        <button id="btnAtualizar" onclick="atualizarApp()" title="Limpa o cache do app e recarrega">ðŸ”„ Atualizar</button>
    </div>

    <div class="tabs" id="tabsBar">
        <button class="tabBtn active" id="tabBtnGanhos" onclick="mudarAba('ganhos')">ðŸš— Ganhos</button>

    </div>

    <!-- ===================== ABA GANHOS ===================== -->
    <div id="tabGanhos" class="tabContent active">

        <button class="toggle" onclick="toggleTheme()">ðŸŒ™ / â˜€ï¸ Alternar Tema</button>
        <div class="card" style="text-align:center;position:relative">
            <button onclick="resetarPonto()" title="Resetar horÃ¡rio" style="position:absolute;top:10px;right:10px;width:auto;padding:6px 9px;font-size:14px;background:rgba(255,255,255,.15);color:inherit;border-radius:10px">â†º</button>
            <div><b>ðŸ’° Total Geral</b></div><div id="totalGeral" style="font-size:28px">R$ 0,00</div>
            <div id="pontoStatus" style="margin-top:10px;font-size:14px;opacity:.85;line-height:1.6"></div>

        <button class="metaBtn" onclick="toggleMetaMenu()">

<div class="overlay" id="overlay">

<script>
/* ======================================================================
   ABAS
   ====================================================================== */
function mudarAba(aba){
    document.getElementById("tabGanhos").classList.toggle("active", aba==="ganhos");
    document.getElementById("tabPix").classList.toggle("active", aba==="pix");
    document.getElementById("tabBtnGanhos").classList.toggle("active", aba==="ganhos");
    document.getElementById("tabBtnPix").classList.toggle("active", aba==="pix");

    document.getElementById("topBar").style.display = aba==="pix" ? "none" : "block";
    document.getElementById("tabsBar").style.display = aba==="pix" ? "none" : "flex";

    localStorage.setItem("abaAtiva", aba);
}

/* ======================================================================
   ATUALIZAR APP (limpa cache do navegador, preserva dados salvos)
   ====================================================================== */
async function atualizarApp(){
    let btn = document.getElementById("btnAtualizar");
    btn.innerHTML = "â³ Atualizando...";
    btn.disabled = true;

    try{
        if("caches" in window){
            let nomes = await caches.keys();
            await Promise.all(nomes.map(n=>caches.delete(n)));
        }
        if("serviceWorker" in navigator){
            let regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r=>r.unregister()));
        }
    }catch(e){
        console.warn("Erro ao limpar cache:", e);
    }

    let url = new URL(window.location.href);
    url.searchParams.set("_r", Date.now());
    window.location.href = url.toString();
}

/* ======================================================================
   RESPONSIVIDADE - reconhece a tela do usuÃ¡rio
   ====================================================================== */
function ajustarTela(){
    document.body.classList.toggle("compact", window.innerWidth < 360);
}
window.addEventListener("resize", ajustarTela);

/* ======================================================================
   GANHOS POR HORA / CONTROLE DE CORRIDAS
   ====================================================================== */
let META = parseFloat(localStorage.getItem("metaHora")) || 30;
let corridas = JSON.parse(localStorage.getItem("corridas")) || [];

function salvar(){
    localStorage.setItem("corridas", JSON.stringify(corridas));
}

function chaveHora(timestamp){
    let d = new Date(timestamp);
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}-${d.getHours()}`;
}

function renderizar(){
    let container = document.getElementById("listaHoras");
    container.innerHTML="";document.getElementById("totalGeral").innerText="R$ "+corridas.reduce((a,c)=>a+c.valor,0).toFixed(2);

    let grupos = {};

    corridas.forEach((corrida,index)=>{
        let chave = chaveHora(corrida.timestamp);
        if(!grupos[chave]) grupos[chave]=[];
        grupos[chave].push({...corrida,index});
    });

    let chaves = Object.keys(grupos).sort().reverse();

    chaves.forEach(chave=>{
        let lista = grupos[chave];
        let data = new Date(lista[0].timestamp);
        let hora = data.getHours().toString().padStart(2,"0");
        let total = lista.reduce((s,c)=>s+c.valor,0);

        let bloco = document.createElement("div");
        bloco.className = "hourBlock";

        let statusHTML = "";
        if(total>=META){
            statusHTML=`<div class="status" style="color:#00c853">âœ… Meta batida!</div>`;
        } else {
            statusHTML=`<div class="status" style="color:#ff9800">Faltam R$ ${(META-total).toFixed(2)}</div>`;
        }

        bloco.innerHTML = `
            <div class="hourTitle">Hora ${hora}:00 - ${hora}:59</div>
            <div class="hourTotal">R$ ${total.toFixed(2)}</div>
            ${statusHTML}
        `;

        lista.forEach(corrida=>{
            let div = document.createElement("div");
            div.className = "ride";

            let horaMin = new Date(corrida.timestamp).toLocaleTimeString([],{
                hour:'2-digit',
                minute:'2-digit'
            });

            div.innerHTML = `
                <div>${horaMin} â†’ R$ ${corrida.valor.toFixed(2)}</div>
                <div class="actions">
                    <button onclick="editarCorrida(${corrida.index})">âœï¸</button>
                    <button onclick="excluirCorrida(${corrida.index})">ðŸ—‘ï¸</button>
                </div>
            `;

            bloco.appendChild(div);
        });

        container.appendChild(bloco);
    });

    criarHoraAtualSeNecessario();
}

function criarHoraAtualSeNecessario(){
    let agora = new Date();
    let chaveAtual = chaveHora(agora.toISOString());
    let existe = corridas.some(c=>chaveHora(c.timestamp)===chaveAtual);

    if(!existe){
        let container = document.getElementById("listaHoras");
        let hora = agora.getHours().toString().padStart(2,"0");

        let bloco = document.createElement("div");
        bloco.className = "hourBlock";
        bloco.innerHTML = `
            <div class="hourTitle">Hora ${hora}:00 - ${hora}:59</div>
            <div class="hourTotal">R$ 0.00</div>
            <div class="status" style="color:#ff9800">Faltam R$ ${META.toFixed(2)}</div>
        `;
        container.prepend(bloco);
    }
}

function adicionarCorrida(){
    let input = document.getElementById("valorCorrida");
    let valor = parseFloat(input.value);

    if(isNaN(valor)||valor<=0){
        alert("Digite valor vÃ¡lido");
        return;
    }

    corridas.unshift({
        valor,
        timestamp:new Date().toISOString()
    });

    input.value="";
    salvar();
    renderizar();
}

function editarCorrida(index){
    let novo = prompt("Novo valor:",corridas[index].valor);

    if(novo!==null){
        novo = parseFloat(novo);
        if(!isNaN(novo)&&novo>0){
            corridas[index].valor = novo;
            salvar();
            renderizar();
        }
    }
}

function excluirCorrida(index){
    corridas.splice(index,1);
    salvar();
    renderizar();
}

function toggleTheme(){
    let body=document.body;
    let tema=body.classList.contains("dark")?"light":"dark";
    body.className=tema;
    if(document.body.classList.contains("compact")===false && window.innerWidth<360){
        body.classList.add("compact");
    }
    localStorage.setItem("tema",tema);
}

function carregarTema(){
    document.body.className=localStorage.getItem("tema")||"dark";
}

function toggleMetaMenu(){
    let menu=document.getElementById("metaOptions");
    menu.style.display = menu.style.display==="flex" ? "none" : "flex";
}

function alterarMeta(valor){
    META = valor;
    localStorage.setItem("metaHora", valor);
    document.getElementById("metaAtual").innerText = valor;
    document.getElementById("metaOptions").style.display = "none";
    renderizar();
}

function carregarMeta(){
    document.getElementById("metaAtual").innerText = META;
}

/* ===== Controle de Ponto ===== */
let ponto = JSON.parse(localStorage.getItem("ponto")) || {estado:"parado", inicio:null, intervalos:[], fim:null};

function salvarPonto(){
    localStorage.setItem("ponto", JSON.stringify(ponto));
}

function formatarHora(ts){
    return new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function formatarDuracao(ms){
    if(ms<0) ms=0;
    let totalMin = Math.floor(ms/60000);
    let h = Math.floor(totalMin/60);
    let m = totalMin%60;
    return `${h}h ${m}min`;
}

function calcularTotalTrabalhado(){
    if(!ponto.inicio) return 0;
    let fim = ponto.fim ? new Date(ponto.fim) : new Date();
    let totalMs = fim - new Date(ponto.inicio);

    ponto.intervalos.forEach(iv=>{
        let ivFim = iv.fim ? new Date(iv.fim) : new Date();
        totalMs -= (ivFim - new Date(iv.inicio));
    });

    return totalMs;
}

function renderizarPontoUI(){
    let status = document.getElementById("pontoStatus");
    let botoes = document.getElementById("pontoBotoes");

    if(ponto.estado==="parado"){
        status.innerHTML = ponto.fim
            ? `Ãšltimo turno: ${formatarHora(ponto.inicio)} â†’ ${formatarHora(ponto.fim)} (${formatarDuracao(calcularTotalTrabalhado())} trabalhados)`
            : "Turno nÃ£o iniciado";
        botoes.innerHTML = `<button class="primary" onclick="iniciarTrabalho()">â–¶ Iniciar turno</button>`;
    } else if(ponto.estado==="trabalhando"){
        status.innerHTML = `ðŸŸ¢ Trabalhando desde ${formatarHora(ponto.inicio)} Â· ${formatarDuracao(calcularTotalTrabalhado())}`;
        botoes.innerHTML = `
            <div style="display:flex;gap:8px">
                <button class="toggle" style="flex:1;margin-bottom:0" onclick="pausarTrabalho()">â¸ Pausar</button>
                <button class="metaBtn" style="flex:1;margin-bottom:0" onclick="encerrarTrabalho()">â¹ Encerrar</button>
            </div>`;
    } else if(ponto.estado==="pausado"){
        status.innerHTML = `ðŸŸ  Pausado Â· trabalhado atÃ© agora: ${formatarDuracao(calcularTotalTrabalhado())}`;
        botoes.innerHTML = `

                <button class="primary" style="flex:1;margin-bottom:0" onclick="retomarTrabalho()">â–¶ Retomar</button>
                <button class="metaBtn" style="flex:1;margin-bottom:0" onclick="encerrarTrabalho()">â¹ Encerrar</button>

}

function iniciarTrabalho(){
    let km = prompt("KM inicial (opcional, deixe em branco para pular):","");
    let kmInicial = null;
    if(km!==null && km.trim()!==""){
        let n = parseFloat(km);
        if(!isNaN(n)) kmInicial = n;
    }

    ponto = {
        estado:"trabalhando",
        inicio:new Date().toISOString(),
        intervalos:[],
        fim:null,
        kmInicial,
        kmFinal:null
    };
    salvarPonto();
    renderizarPontoUI();
}

function pausarTrabalho(){
    if(ponto.estado!=="trabalhando") return;
    ponto.intervalos.push({inicio:new Date().toISOString(), fim:null});
    ponto.estado = "pausado";
    salvarPonto();
    renderizarPontoUI();
}

function retomarTrabalho(){
    if(ponto.estado!=="pausado") return;
    let ultimo = ponto.intervalos[ponto.intervalos.length-1];
    if(ultimo && !ultimo.fim) ultimo.fim = new Date().toISOString();
    ponto.estado = "trabalhando";
    salvarPonto();
    renderizarPontoUI();
}

function encerrarTrabalho(){
    if(ponto.estado==="parado") return;

    if(ponto.estado==="pausado"){
        let ultimo = ponto.intervalos[ponto.intervalos.length-1];
        if(ultimo && !ultimo.fim) ultimo.fim = new Date().toISOString();
    }

    let km = prompt("KM final (opcional, deixe em branco para pular):","");
    if(km!==null && km.trim()!==""){
        let n = parseFloat(km);
        if(!isNaN(n)) ponto.kmFinal = n;
    }

    ponto.fim = new Date().toISOString();
    ponto.estado = "parado";
    salvarPonto();
    renderizarPontoUI();
}

function resetarPonto(){
    if(!confirm("Resetar o controle de ponto? Isso nÃ£o apaga as corridas jÃ¡ registradas.")) return;
    ponto = {estado:"parado", inicio:null, intervalos:[], fim:null, kmInicial:null, kmFinal:null};
    salvarPonto();
    renderizarPontoUI();
}

    editandoChaveIndex = index;

/* ======================================================================
   PIX - GERAÃ‡ÃƒO DO QR CODE (payload BR Code / EMV)
   ====================================================================== */
function crc16(str){
    let crc = 0xFFFF;
    for(let i=0;i<str.length;i++){
        crc ^= str.charCodeAt(i) << 8;
        for(let b=0;b<8;b++){
            crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
            crc &= 0xFFFF;
        }
    }
    return crc.toString(16).toUpperCase().padStart(4,"0");
}

function emv(id,value){
    let len = value.length.toString().padStart(2,"0");
    return `${id}${len}${value}`;
}

function montarPayloadPix(chave, valor, nome, cidade){
    nome = (nome||"RECEBEDOR").substring(0,25).toUpperCase();
    cidade = (cidade||"BRASIL").substring(0,15).toUpperCase();

    let merchantAccount = emv("00","BR.GOV.BCB.PIX") + emv("01",chave);
    let campos =
        emv("00","01") +
        emv("26",merchantAccount) +
        emv("52","0000") +
        emv("53","986") +
        (valor ? emv("54",valor.toFixed(2)) : "") +
        emv("58","BR") +
        emv("59",nome) +
        emv("60",cidade) +
        emv("62",emv("05","***"));

    let semCrc = campos + "6304";
    return semCrc + crc16(semCrc);
}

function gerarPix(){
    let select = document.getElementById("chaveSelect");
    let index = select.value;

    if(index===""||!chaves[index]){
        alert("Cadastre e selecione uma chave Pix");
        return;
    }

    let chave = chaves[index];
    let valorInput = parseFloat(document.getElementById("valor").value);
    let valorFinal = !isNaN(valorInput) && valorInput>0
        ? (taxaAtiva ? valorInput*1.2 : valorInput)
        : null;

    let payload = montarPayloadPix(chave.valor, valorFinal, chave.nome, "BRASIL");

    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), {
        text: payload,
        width: 220,
        height: 220
    });

    document.getElementById("formArea").style.display = "none";
    document.getElementById("qrArea").style.display = "block";
}

function baixarRelatorio(){
    let hoje = new Date();
    let corridasHoje = corridas.filter(c=>{
        let d = new Date(c.timestamp);
        return d.toDateString()===hoje.toDateString();
    });

    let total = corridasHoje.reduce((a,c)=>a+c.valor,0);

    let linhas = corridasHoje.map(c=>{
        let h = new Date(c.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        return `${h} - R$ ${c.valor.toFixed(2)}`;
    });

    let texto =
        `RelatÃ³rio de corridas - ${hoje.toLocaleDateString()}\n` +
        `${"=".repeat(30)}\n` +
        linhas.join("\n") +
        `\n${"=".repeat(30)}\n` +
        `Total: R$ ${total.toFixed(2)}\n` +
        `Corridas: ${corridasHoje.length}`;

    let blob = new Blob([texto], {type:"text/plain"});
    let url = URL.createObjectURL(blob);
    let a = document.createElement("a");
    a.href = url;
    a.download = `relatorio-${hoje.toISOString().slice(0,10)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
}
